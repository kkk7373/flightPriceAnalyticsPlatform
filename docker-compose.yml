services:
  frontend:
    container_name: frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - BACKEND_SERVER=http://backend:8080
    ports:
      - "5173:5173"
    build:
      context: ./frontend
    tty: true
    volumes:
      - ./frontend:/workspace/frontend:cached
    depends_on:
      - backend

  backend:
    container_name: backend
    command: sh ./mvnw spring-boot:run
    working_dir: /workspace/backend/backend
    env_file:
      - path: ./backend/backend/.env
        required: false
    environment:
      AWS_PROFILE: flight-dev
    ports:
      - "8080:8080"
    build:
      context: ./backend
      target: development
    tty: true
    volumes:
      - ./backend:/workspace/backend:cached
      - ${HOME}/.aws:/root/.aws:ro
